name: Release
# Every merge to main publishes a release that installed copies of Mack
# update from: version <major>.<minor>.<run number>, with major.minor from
# package.json, so each release is newer than the last without a commit to
# bump it. Run it by hand from the Actions tab too. The installer is signed
# when signing secrets are set (see docs/RELEASING.md); without them it is
# published unsigned.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Version from the run number
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          npm version "$base.${GITHUB_RUN_NUMBER}" --no-git-tag-version
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build && npx electron-builder --win --publish never
        env:
          # A code-signing certificate (.pfx, base64) and its password, when you have one.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # One release made here, not by electron-builder: its parallel uploads
      # each tried to create the release, and the loser failed the job. gh
      # uploads every file to a draft and only then publishes it, so no one
      # sees a release without its installer and latest.yml.
      - name: Publish
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          gh release create "v$v" "release/Mack-Setup-$v.exe" "release/Mack-Setup-$v.exe.blockmap" release/latest.yml \
            --target "$GITHUB_SHA" --title "Mack $v" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
