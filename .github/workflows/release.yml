name: Release
# Every merge to main publishes a release that installed copies of Mack
# update from: version <major>.<minor>.<run number>, with major.minor from
# package.json, so each release is newer than the last without a commit to
# bump it. Run it by hand from the Actions tab too. Windows (NSIS installer)
# and Linux (AppImage) are built side by side and published as one release;
# each platform updates from its own latest*.yml. The Windows installer is
# signed when signing secrets are set (see docs/RELEASING.md); without them it
# is published unsigned.
on:
  push:
    branches: [main]
    # A merged community proof is not a new version of the app.
    paths-ignore: ["community/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Version from the run number
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          npm version "$base.${GITHUB_RUN_NUMBER}" --no-git-tag-version
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build && npx electron-builder --win --publish never
        env:
          # A code-signing certificate (.pfx, base64) and its password, when you have one.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/Mack-Setup-*.exe
            release/Mack-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Version from the run number
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          npm version "$base.${GITHUB_RUN_NUMBER}" --no-git-tag-version
      - run: npm test
      - name: Build
        run: npm run build && npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/Mack-*.AppImage
            release/latest-linux.yml
          if-no-files-found: error

  # One release made here, not by electron-builder: its parallel uploads
  # each tried to create the release, and the loser failed the job. gh
  # uploads every file to a draft and only then publishes it, so no one
  # sees a release without its installers and latest*.yml.
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        shell: bash
        run: |
          ls -la dist
          exe=$(ls dist/Mack-Setup-*.exe)
          v=$(basename "$exe" .exe); v=${v#Mack-Setup-}
          gh release create "v$v" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mack $v" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
