name: CI
on:
  push:
    branches: [main]
    paths-ignore: ["community/proofs/**", "benchmarks/runs/**"]
  pull_request:
    paths-ignore: ["community/proofs/**", "benchmarks/runs/**"]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  # The same on Linux, where the AppImage is built: what breaks there shows on the pull request, not at release.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
