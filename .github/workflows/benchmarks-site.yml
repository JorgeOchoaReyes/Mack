# Publishes the benchmark leaderboard (core/bench/site.ts) to GitHub Pages
# whenever a shared run is merged into benchmarks/runs/. Needs Pages enabled
# once: Settings → Pages → Source: GitHub Actions.
name: Benchmark site
on:
  push:
    branches: [main]
    paths: ["benchmarks/runs/**", "core/bench/**", "scripts/build-bench-site.ts", ".github/workflows/benchmarks-site.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: benchmark-site
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc -p tsconfig.electron.json
      - run: node dist-electron/scripts/build-bench-site.js _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
