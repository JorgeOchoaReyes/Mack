# Official benchmark runs, run the way the labs run a whole set: started by
# hand from the Actions tab ("Run workflow"), by the repository owner only.
# - The fixed sample is split across up to 20 free GitHub machines that run at
#   once (each gets every n-th problem, so easy and hard alike).
# - Pass@k by default, as the labs report: k independent samples per problem,
#   each checked exactly as written. Every problem gets the same budget and is
#   independent of the others: no lemmas are shared between problems.
# - A last job joins the parts into one run and opens a pull request with the
#   run marked official (benchmarks/runs/<folder>/), for the owner to review
#   and merge; CI re-checks every proof as for any shared run, and once merged
#   the site shows it with an Official badge. A run whose budget ran out opens
#   as a draft that says so (its skipped problems count as unsolved); one
#   missing a machine's part (cancelled, or past the 6-hour limit) opens
#   nothing. The parts and the joined run.json are kept as artifacts.
#
# Needs, in Settings → Secrets and variables → Actions:
# - the API key of each provider used: FIREWORKS_API_KEY, OPENROUTER_API_KEY,
#   CHEAPER_INFERENCE_API_KEY;
# - MACK_BENCH_TOKEN (recommended): a fine-grained token on this repo with
#   Contents and Pull requests read/write. A pull request opened with the
#   default token does not start the required checks, so it could not be
#   merged without them.
name: Official benchmark run
# What ran, in the list of runs: "Official · passk@32 · minif2f-test ×244 · model".
run-name: "Official · ${{ inputs.method }}${{ inputs.method == 'passk' && format('@{0}', inputs.attempts) || '' }} · ${{ inputs.set }} ×${{ inputs.problems }} · ${{ (inputs.model == 'custom' && inputs.custom_model || inputs.model) }}"
on:
  workflow_dispatch:
    inputs:
      set:
        description: Problem set
        type: choice
        options: [minif2f-test, putnambench, putnam-recent]
        default: minif2f-test
      problems:
        description: Problems (the fixed sample of this size; the set's size runs the whole set)
        default: "244"
      method:
        description: "Protocol: passk is the labs' pass@k (attempts = k); the others are Mack agent methods"
        type: choice
        options: [passk, single, decompose, steps, search, ultramath]
        default: passk
      provider:
        description: Provider
        type: choice
        options: [openrouter, fireworks, cheaperinference]
        default: openrouter
      model:
        description: Model (pick "custom" to type any other id below)
        type: choice
        options:
          - deepseek-v4.1-flash
          - glm-5.3
          - deepseek/deepseek-r1
          - custom
        default: deepseek-v4.1-flash
      custom_model:
        description: Custom model id, as the provider names it (used when Model is "custom")
        default: ""
      prover:
        description: Prover models, comma-separated (optional)
        default: ""
      effort:
        description: Thinking level
        type: choice
        options: [default, off, low, medium, high, xhigh]
        default: default
      attempts:
        description: Attempts per problem (k for pass@k)
        default: "32"
      machines:
        description: Machines in parallel (1-20)
        default: "20"
      budget:
        description: Budget in USD for the whole run (0 = none; a run cut short by it opens no PR)
        default: "0"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: official-benchmark
  cancel-in-progress: false
jobs:
  plan:
    # Official runs are the owner's to make.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - id: plan
        shell: bash
        env:
          IN_MACHINES: ${{ inputs.machines }}
          IN_SET: ${{ inputs.set }}
          IN_PROBLEMS: ${{ inputs.problems }}
          IN_METHOD: ${{ inputs.method }}
          IN_PROVIDER: ${{ inputs.provider }}
          IN_MODEL: ${{ (inputs.model == 'custom' && inputs.custom_model || inputs.model) }}
          IN_PROVER: ${{ inputs.prover }}
          IN_EFFORT: ${{ inputs.effort }}
          IN_ATTEMPTS: ${{ inputs.attempts }}
          IN_BUDGET: ${{ inputs.budget }}
        # The run's settings on its summary page at once, while the machines work.
        run: |
          if [ -z "$IN_MODEL" ] || [ "$IN_MODEL" = custom ]; then echo "::error::Model is \"custom\" but no custom model id was given."; exit 1; fi
          {
            echo "## Official benchmark run: started"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Set | \`$IN_SET\`, $IN_PROBLEMS problems |"
            echo "| Protocol | \`$IN_METHOD\`, $IN_ATTEMPTS attempts per problem |"
            echo "| Model | \`$IN_MODEL\` ($IN_PROVIDER) |"
            echo "| Prover models | ${IN_PROVER:-none} |"
            echo "| Thinking | $IN_EFFORT |"
            echo "| Machines | $IN_MACHINES |"
            echo "| Budget | \$$IN_BUDGET (0 = none) |"
            echo ""
            echo "Each machine adds its problems' results here when it finishes; the last job adds the whole run."
          } >> "$GITHUB_STEP_SUMMARY"
          n=$(printf '%s' "$IN_MACHINES" | tr -cd '0-9')
          n=${n:-1}
          [ "$n" -lt 1 ] && n=1
          [ "$n" -gt 20 ] && n=20
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "parts=$(seq -s, 0 $((n - 1)) | sed 's/^/[/;s/$/]/')" >> "$GITHUB_OUTPUT"
      # The provider's own model list, with the run's key: a model id it does not list stops the run here, before any
      # machine starts, with the closest ids; the whole list (and prices) goes on the run's summary page.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc -p tsconfig.electron.json
      - name: Check the model is on the provider's list
        shell: bash
        env:
          IN_PROVIDER: ${{ inputs.provider }}
          IN_MODEL: ${{ (inputs.model == 'custom' && inputs.custom_model || inputs.model) }}
          IN_PROVER: ${{ inputs.prover }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHEAPER_INFERENCE_API_KEY: ${{ secrets.CHEAPER_INFERENCE_API_KEY }}
        run: node dist-electron/scripts/check-model.js --provider "$IN_PROVIDER" --model "$IN_MODEL" --prover "$IN_PROVER"

  part:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install elan
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: community/lean/.lake
          key: community-lake-${{ hashFiles('community/lean/lake-manifest.json', 'community/lean/lean-toolchain') }}
      - name: Mathlib
        working-directory: community/lean
        run: |
          lake exe cache get
          lake build Mathlib
      - name: Lean REPL (as Mack's setup builds it)
        shell: bash
        run: |
          tag=$(cut -d: -f2 community/lean/lean-toolchain)
          git clone --depth 1 --branch "$tag" https://github.com/leanprover-community/repl community/lean/.mack/repl
          (cd community/lean/.mack/repl && lake build)
      - run: npm ci
      - run: npx tsc -p tsconfig.electron.json
      - name: Run this machine's part
        shell: bash
        # Inputs reach the command only as environment variables, never as code.
        env:
          IN_SET: ${{ inputs.set }}
          IN_PROBLEMS: ${{ inputs.problems }}
          IN_METHOD: ${{ inputs.method }}
          IN_PROVIDER: ${{ inputs.provider }}
          IN_MODEL: ${{ (inputs.model == 'custom' && inputs.custom_model || inputs.model) }}
          IN_PROVER: ${{ inputs.prover }}
          IN_EFFORT: ${{ inputs.effort }}
          IN_ATTEMPTS: ${{ inputs.attempts }}
          IN_BUDGET: ${{ inputs.budget }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHEAPER_INFERENCE_API_KEY: ${{ secrets.CHEAPER_INFERENCE_API_KEY }}
        run: |
          node dist-electron/scripts/run-bench.js \
            --set "$IN_SET" --problems "$IN_PROBLEMS" --method "$IN_METHOD" \
            --provider "$IN_PROVIDER" --model "$IN_MODEL" --prover "$IN_PROVER" --effort "$IN_EFFORT" \
            --attempts "$IN_ATTEMPTS" --budget "$IN_BUDGET" --lemma-pool false \
            --shard "$SHARD" --shards "$SHARDS" \
            --workspace "$PWD/community/lean" --lean-processes 2 --scratch "$RUNNER_TEMP/mack-bench" \
            --official "$RUN_URL" --platform "GitHub Actions ubuntu-latest"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/mack-bench/shard-*.json
            ${{ runner.temp }}/mack-bench/traces-*.jsonl
          if-no-files-found: ignore

  merge:
    needs: [plan, part]
    # Runs even when a part failed, so what did finish is kept; an incomplete run opens nothing.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MACK_BENCH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc -p tsconfig.electron.json
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: ${{ runner.temp }}/parts
          merge-multiple: true
      - name: Join the parts
        id: bench
        shell: bash
        env:
          # owner/name of the Hugging Face dataset for the full traces (Settings → Variables); empty publishes none.
          MACK_TRACES_DATASET: ${{ vars.MACK_TRACES_DATASET }}
        run: |
          shopt -s nullglob
          parts=("$RUNNER_TEMP"/parts/shard-*.json)
          if [ ${#parts[@]} -eq 0 ]; then echo "No part finished."; exit 1; fi
          node dist-electron/scripts/merge-bench.js --scratch "$RUNNER_TEMP/mack-bench" --traces "$RUNNER_TEMP/parts" "${parts[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-run
          path: ${{ runner.temp }}/mack-bench/run.json
          if-no-files-found: ignore
      # Every attempt's full thinking and reply, one file per problem, to the Hugging Face dataset; the site links there.
      # A failed upload never blocks the results: the run is then published without the link.
      - name: Publish the full traces to Hugging Face
        id: traces
        if: steps.bench.outputs.traces == 'true'
        continue-on-error: true
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MACK_TRACES_DATASET: ${{ vars.MACK_TRACES_DATASET }}
          FOLDER: ${{ steps.bench.outputs.folder }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "### Traces not published: add the HF_TOKEN secret (a Hugging Face token with write access)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          pip install --quiet "huggingface_hub>=0.30"
          url=$(python3 scripts/publish-traces.py "$RUNNER_TEMP/mack-bench/traces" "$FOLDER")
          echo "### Full traces: $url" >> "$GITHUB_STEP_SUMMARY"
      # Opened for review, never merged here: the owner reads the results and merges to publish. A run cut short
      # (a spent budget) opens as a draft that says why; one missing a machine's part opens nothing.
      - name: Open the pull request for review
        if: steps.bench.outputs.listed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MACK_BENCH_TOKEN || github.token }}
          FOLDER: ${{ steps.bench.outputs.folder }}
          TITLE: ${{ steps.bench.outputs.title }}
          COMPLETE: ${{ steps.bench.outputs.complete }}
          TRACES: ${{ steps.bench.outputs.traces }}
          TRACES_UPLOADED: ${{ steps.traces.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="official/$FOLDER-${{ github.run_id }}"
          git checkout -b "$branch"
          # Traces that did not reach Hugging Face are not linked.
          if [ "$TRACES" = true ] && [ "$TRACES_UPLOADED" != success ]; then
            jq 'del(.traces)' "benchmarks/runs/$FOLDER/run.json" > run.tmp && mv run.tmp "benchmarks/runs/$FOLDER/run.json"
          fi
          git add "benchmarks/runs/$FOLDER"
          git commit -m "Official $TITLE"
          git push origin "$branch"
          draft=()
          [ "$COMPLETE" = true ] || draft=(--draft)
          # The default token may not open pull requests (and one it opens would not start the checks): MACK_BENCH_TOKEN can.
          if ! url=$(gh pr create "${draft[@]}" --base main --head "$branch" --title "Official $TITLE" --body-file "$RUNNER_TEMP/mack-bench/pr-body.md"); then
            link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            {
              echo "### ⚠️ The results were pushed, but the pull request could not be opened"
              echo ""
              echo "Add the \`MACK_BENCH_TOKEN\` secret (a fine-grained token on this repo with Contents and Pull requests read/write) so the next run opens it itself. For this run, open it by hand: $link"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=No pull request::The results are on branch $branch, but this token may not open pull requests. Add the MACK_BENCH_TOKEN secret, or open it by hand: $link"
            exit 1
          fi
          echo "### Pull request for review: $url" >> "$GITHUB_STEP_SUMMARY"
          [ "$COMPLETE" = true ] || echo "Opened as a draft: the run was cut short (see above). Mark it ready to publish it anyway." >> "$GITHUB_STEP_SUMMARY"
