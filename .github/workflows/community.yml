# Checks community proofs (community/proofs/<entry>/) with Mack's strict
# verifier: Proof.lean must prove Statement.lean exactly, with no sorry and
# only standard axioms, against the Mathlib pinned in community/lean. Make
# this check required on main so an entry merges only when Lean accepts it.
name: Community proofs
on:
  pull_request:
    paths: ["community/**", "scripts/verify-community.ts", "core/community.ts", "core/lean/**"]
  push:
    branches: [main]
    paths: ["community/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Entries this change touches
        id: entries
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            dirs=$(git diff --name-only "$base"...HEAD -- community/proofs | awk -F/ 'NF>=4 {print $1"/"$2"/"$3}' | sort -u | tr '\n' ' ')
            echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
            # A change to the verifier or the pinned workspace re-checks every entry.
            if git diff --name-only "$base"...HEAD | grep -qE '^(core/lean/|community/lean/|scripts/verify-community.ts|core/community.ts)'; then echo "all=1" >> "$GITHUB_OUTPUT"; fi
          else
            echo "all=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Install elan
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: community/lean/.lake
          key: community-lake-${{ hashFiles('community/lean/lake-manifest.json', 'community/lean/lean-toolchain') }}
      - name: Mathlib
        working-directory: community/lean
        run: |
          lake exe cache get
          lake build Mathlib
      - run: npm ci
      - run: npx tsc -p tsconfig.electron.json
      - name: Strict verifier
        shell: bash
        run: |
          if [ -n "${{ steps.entries.outputs.all }}" ]; then
            node dist-electron/scripts/verify-community.js community/lean
          elif [ -n "${{ steps.entries.outputs.dirs }}" ]; then
            node dist-electron/scripts/verify-community.js community/lean ${{ steps.entries.outputs.dirs }}
          else
            echo "No community entries changed."
          fi
